[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mineru-gateway"
version = "0.1.0"
description = "A DB-backed, S3-durable, autoscaling gateway that wraps MinerU with a Mistral-compatible /v1/ocr facade."
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
authors = [{ name = "mineru-gateway contributors" }]
keywords = ["mineru", "ocr", "pdf", "gateway", "litellm", "mistral", "s3", "autoscaling"]

# --- Runtime dependencies -----------------------------------------------------
# mineru pin: build ON TOP of MinerU by subclassing its router primitives.
# Base `mineru` (no extras) keeps torch/transformers/vllm out — those are only
# needed on worker nodes, not the gateway process.
dependencies = [
    "mineru>=3.4.4,<3.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "click>=8.1",
    "httpx>=0.27",
    # Async AWS (genuinely async — no asyncio.to_thread wrapping of boto3)
    "aioboto3>=13.0",
    # DB: async SQLAlchemy, backend-agnostic. Driver chosen by DATABASE_URL scheme.
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",        # sqlite+aiosqlite (dev/test default)
    # Config: pydantic-settings (YAML + env, startup-only)
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    # Migrations
    "alembic>=1.13",
]

[project.optional-dependencies]
# Drivers for non-sqlite backends. Installed only when needed.
postgres = ["asyncpg>=0.29"]
# OpenTelemetry instrumentation (Phase 9). Install with: uv sync --extra otel
otel = [
    "opentelemetry-distro>=0.48",
    "opentelemetry-instrumentation-fastapi>=0.48",
    "opentelemetry-instrumentation-httpx>=0.48",
    "opentelemetry-exporter-otlp>=0.48",
]

# --- Dev / test extras --------------------------------------------------------
dev = [
    "ruff>=0.5",
    "pyright>=1.1.370",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",            # httpx transport mocking (Tier-2 worker mocking)
    "moto[ec2,s3,server]>=5.0",  # mocked AWS; server extra enables ThreadedMotoServer for aioboto3
    "anyio>=4.0",            # pytest-anyio testing utilities
    "httpx>=0.27",           # AsyncClient for test requests
]
integration = [
    # Docker-gated, behind @pytest.mark.integration / -m "slow"
    "testcontainers[postgres]>=4.0",
]

[project.scripts]
# `mineru-gateway` launches the API gateway (click CLI → uvicorn). See src/mineru_gateway/gateway/main.py.
mineru-gateway = "mineru_gateway.gateway.main:main"
# `mineru-scheduler` launches the single scheduler process (one sequential tick loop).
mineru-scheduler = "mineru_gateway.scheduler.main:main"

# --- Hatchling build config (src layout) --------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/mineru_gateway"]

[tool.hatch.build.targets.sdist]
include = ["src/mineru_gateway", "LICENSE"]

# --- ruff ---------------------------------------------------------------------
[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter; we don't hard-wrap prose
]

[tool.ruff.lint.isort]
known-first-party = ["mineru_gateway"]
# Keep isort layout consistent with the formatter's skip-magic-trailing-comma: don't let a trailing
# comma force imports (or anything else) to expand one-per-line.
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
# FastAPI's documented form: File()/Form()/Depends() as default args. The
# "default" is an instruction to FastAPI's dependency injection, not a value —
# B008 (no function call in default) is a false positive here.
"tests/fakes/worker.py" = ["B008"]
"src/mineru_gateway/gateway/api/**/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# Ignore the magic trailing comma for layout. Without this, any def/call/dict
# with a trailing comma is force-expanded one-per-line even when it fits under
# line-length. We want one-line function signatures and 120-wide filling.
skip-magic-trailing-comma = true

# --- pyright ------------------------------------------------------------------
[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/node_modules"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
# src layout: the package is installed editable into the venv, but tell pyright
# the source root explicitly so relative imports inside src/mineru_gateway
# resolve whether or not the venv is active.
extraPaths = ["src"]
# MinerU upstream is untyped-ish; don't let its imports poison our checks.
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
# OTel is an optional extra; don't fail typecheck when it's not installed.
reportMissingImports = "warning"
reportUnknownVariableType = "none"

# --- pytest -------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
# Default: exclude integration (Docker) and slow (real model) tests.
# Run them explicitly: `task test-integration` or `pytest -m "integration or slow"`.
addopts = "-ra --strict-markers"
markers = [
    "integration: tests requiring Docker (testcontainers / SeaweedFS)",
    "postgres: tests requiring PostgreSQL (testcontainers or MINERU_GATEWAY_TEST_POSTGRES_URL)",
    "slow: tests requiring a real mineru-api worker (Tier-3, end-to-end)",
]
filterwarnings = [
    "error",
    # Allow deprecation noise from upstream deps we can't control.
    "ignore::DeprecationWarning:mineru.*",
    "ignore::DeprecationWarning:pkg_resources.*",
    # Uvicorn server shutdown in tests can leave an in-flight keepalive socket
    # briefly unclosed; pytest's unraisable hook turns it into an error. This is
    # a test-teardown artifact, not a production leak (production uses graceful
    # shutdown). Ignore the specific unraisable warning category.
    "default::pytest.PytestUnraisableExceptionWarning",
]
