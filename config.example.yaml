# mineru-gateway example configuration.
#
# Copy to config.yaml and edit. config.yaml is gitignored (it holds secrets).
#
# Precedence (low → high): defaults below → config.yaml → env
# (MINERU_GATEWAY_* with __ nesting, e.g. MINERU_GATEWAY_SCALING__MAX_WORKERS=12)
# → CLI flags.
#
# Config is read ONCE at startup; changes require a restart (cheap — state
# lives in the DB).

# Database (async SQLAlchemy):
#   sqlite+aiosqlite:///./gateway.db        (dev/test only)
#   postgresql+asyncpg://user:pass@host/db  (production; install [postgres] extra)
database_url: sqlite+aiosqlite:///./gateway.db

# Server bind.
host: "127.0.0.1"
port: 8000

# Unique deployment identity — tags cloud VMs and scopes reconciliation.
deployment_id: "dev-local"

# Process log level (DEBUG | INFO | WARNING | ERROR).
log_level: "INFO"

# Soft upload limit in bytes (0 = only the 1 GiB hard cap applies). Cannot exceed the hard maximum.
# Configure the reverse proxy or ingress with the same or smaller request-body limit so multipart
# parsing cannot spool unbounded data before these checks run.
max_file_size_bytes: 104857600    # 100 MiB

# Cloud workers: true lets the scheduler launch/terminate EC2 GPU workers via the
# launch template below. false = manually registered workers only (Tier-3 setups).
cloud_workers_enabled: false

scaling:
  # Target-tracking on queued/dispatching/processing tasks per serviceable worker.
  target_per_worker: 4
  min_workers: 0
  max_workers: 12
  idle_cooldown_seconds: 300      # stop a worker idle longer than this
  scale_up_cooldown_seconds: 60   # prevent thrash between scale-ups

# Internal API key — required for all non-probe endpoints. The startup guard
# refuses to bind on a public interface unless auth is enabled with a key.
# Replace the placeholder with a real secret (e.g. `openssl rand -hex 32`).
auth:
  enabled: true
  api_key: "change-me-openssl-rand-hex-32"

scheduler:
  dispatch_poll_interval_seconds: 0.5
  reconcile_poll_interval_seconds: 15

reconciliation:
  launch_readiness_timeout_seconds: 1800
  max_failure_count: 8
  stalled_worker_grace_seconds: 900

rotation:
  interval_seconds: 604800
  readiness_timeout_seconds: 1800

retention:
  retention_days: 30
  cleanup_interval_seconds: 3600  # hourly

cache:
  enabled: true
  ttl_seconds: 604800             # 7 days
  # Bypass on Cache-Control: no-cache header or force=true form flag.
  # TTL sweeper drops expired content_cache rows in the background.
  sweeper_interval_seconds: 600

cloud:
  provider: "aws"
  aws:
    region: "us-east-1"
    bucket: "mineru-results"
    # S3: SeaweedFS mini mode for dev/test; omit endpoint_url for AWS S3 in prod.
    endpoint_url: "http://localhost:8333"
    # EC2: moto/local only; omit ec2_endpoint_url for AWS EC2 in prod.
    ec2_endpoint_url: null
    launch_template_id: null
    launch_template_version: "$Latest"
    # Workers live in private subnets; the scheduler reaches them via private
    # IPs. There is no public-worker mode.

attribution:
  # MinerU LICENSE §2: online services built on MinerU must clearly indicate
  # MinerU is used. This is a license obligation, on by default — all three.
  enabled: true
  # Middleware sets these on every response.
  powered_by_header: "MinerU"
  version_header: "MinerU-Version"

otel:
  # OpenTelemetry traces + metrics via OTLP HTTP. Off by default.
  # Install the otel extra: uv sync --extra otel
  enabled: false
  endpoint: "http://localhost:4318"
  service_name: "mineru-gateway"
  scheduler_service_name: "mineru-scheduler"
  metrics_export_interval_seconds: 60
