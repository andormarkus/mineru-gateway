AWSTemplateFormatVersion: "2010-09-09"
Description: >
  mineru-gateway controller — the control plane: one small always-on EC2 instance running the
  gateway API + scheduler + Postgres via docker compose (deploy/compose/docker-compose.sandbox.yml),
  plus (optionally) the results S3 bucket with its lifecycle safety net.

  The controller runs in a PRIVATE subnet with no public IP — the whole data plane is private.
  Egress (SSM agent, docker pulls, git, S3) goes via the VPC's NAT gateway; alternatively give
  the subnet SSM VPC endpoints (ssm, ssmmessages, ec2messages) plus an S3 gateway endpoint.

  Access is SSM Session Manager ONLY: no key pair, no SSH port, and the security group has NO
  inbound rules. The SSM agent on the instance dials out to the SSM service.

  The controller's security group is what worker stacks reference: workers in private subnets
  accept :8000 (mineru-api) and :8001 (bootstrap status) only from this group.

  The one thing this stack cannot do: raise GPU service quota (L-DB2E81BA) — AWS requires an
  account-side approval; request it separately, ideally before deploying. New accounts start at 0.

  Launch → deploy → iterate → remove:
    aws cloudformation create-stack ...            # this template
    aws ssm start-session --target <InstanceId>   # operate
    aws cloudformation delete-stack ...           # stop paying (~$0.04/hr t4g.medium)

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Network
        Parameters:
          - VpcId
          - PrivateSubnetId
      - Label:
          default: Instance
        Parameters:
          - InstanceType
          - RootVolumeSizeGiB
      - Label:
          default: Storage
        Parameters:
          - ResultsBucketName
      - Label:
          default: Naming
        Parameters:
          - EnvironmentName

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the controller. Workers must launch in the same VPC.

  PrivateSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >
      Private subnet with a NAT route (or SSM/S3 VPC endpoints). The controller gets NO public
      IP — no resource in this topology is internet-reachable.

  InstanceType:
    Type: String
    Default: t4g.medium
    AllowedValues:
      - t4g.small
      - t4g.medium
      - t4g.large
      - t3.medium
      - t3.large
    Description: ARM (t4g) matches the default AL2023 arm64 AMI.

  RootVolumeSizeGiB:
    Type: Number
    Default: 40
    MinValue: 20
    MaxValue: 200
    Description: "Root volume: docker images, Postgres data, repo clone."

  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: AL2023 (SSM agent + dnf). Must be arm64 for t4g types.

  EnvironmentName:
    Type: String
    Default: sandbox
    Description: Prefix for resource names; also scopes the SSM parameter namespace.

  ResultsBucketName:
    Type: String
    Default: ""
    Description: >
      Existing bucket to use for payloads/results/cache. Leave empty to create
      <account>-<environment>-mineru-results in this stack (with lifecycle rules).

Conditions:
  CreateBucket: !Equals [!Ref ResultsBucketName, ""]

Resources:
  ResultsBucket:
    Type: AWS::S3::Bucket
    Condition: CreateBucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub "${AWS::AccountId}-${EnvironmentName}-mineru-results"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-payloads
            Filter: {Prefix: payloads/}
            Status: Enabled
            ExpirationInDays: 7
          - Id: expire-results
            Filter: {Prefix: results/}
            Status: Enabled
            ExpirationInDays: 90
          - Id: expire-cache
            Filter: {Prefix: cache/}
            Status: Enabled
            ExpirationInDays: 90

  ControllerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-mineru-gateway-controller"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-mineru-gateway-controller-role"

  ControllerPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: mineru-gateway-controller
      Roles:
        - !Ref ControllerInstanceRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SchedulerControlsWorkers
            Effect: Allow
            Action:
              - ec2:RunInstances
              - ec2:StartInstances
              - ec2:StopInstances
              - ec2:TerminateInstances
              - ec2:DescribeInstances
              - ec2:DescribeInstanceTypes
            Resource: "*"
          - Sid: ReadWorkerLaunchTemplateRef
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mineru-gateway/*"
          - Sid: ResultsBucketAccess
            Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource:
              - !Sub
                - "arn:aws:s3:::${Bucket}"
                - Bucket: !If [CreateBucket, !Ref ResultsBucket, !Ref ResultsBucketName]
          - Sid: ResultsObjectAccess
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:AbortMultipartUpload
              - s3:ListMultipartUploadParts
            Resource:
              - !Sub
                - "arn:aws:s3:::${Bucket}/*"
                - Bucket: !If [CreateBucket, !Ref ResultsBucket, !Ref ResultsBucketName]

  ControllerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${EnvironmentName}-mineru-gateway-controller"
      Roles:
        - !Ref ControllerInstanceRole

  ControllerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${EnvironmentName}-mineru-gateway-controller"
      GroupDescription: >
        mineru-gateway controller — NO inbound (SSM Session Manager only). Workers accept
        8000/8001 from this group; operators tunnel the gateway port via SSM port forwarding.
      VpcId: !Ref VpcId
      SecurityGroupIngress: []
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: SSM service, docker registry, S3, package repos
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-mineru-gateway-controller"

  ControllerInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref ControllerInstanceProfile
      SubnetId: !Ref PrivateSubnetId
      SecurityGroupIds:
        - !Ref ControllerSecurityGroup
      # Deliberately NO KeyName: SSM Session Manager is the only way in.
      # Deliberately NO public IP: the controller lives in a private subnet.
      AssociatePublicIpAddress: false
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref RootVolumeSizeGiB
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      Monitoring:
        Enabled: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-mineru-gateway-controller"
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          exec > /var/log/controller-setup.log 2>&1
          dnf update -y
          dnf install -y docker git curl
          dnf install -y docker-compose-plugin
          systemctl enable --now docker
          usermod -aG docker ec2-user
          # SSM agent ships with AL2023 and needs no config with the managed policy attached.
          systemctl enable --now amazon-ssm-agent || true
          echo "mineru-gateway controller ready (docker $(docker --version))"

Outputs:
  InstanceId:
    Description: SSM target for the controller — aws ssm start-session --target <id>
    Value: !Ref ControllerInstance

  SecurityGroupId:
    Description: >
      Pass as GatewaySecurityGroupId to the worker stack (mineru-worker.yaml) — workers allow
      8000/8001 inbound from this group only.
    Value: !Ref ControllerSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-SecurityGroupId"

  RoleName:
    Description: >
      Pass as HostRoleName to the worker stack — it grants this role iam:PassRole on the
      worker role it creates.
    Value: !Ref ControllerInstanceRole

  ResultsBucketName:
    Description: >
      Results bucket (created here unless an existing name was given). Same value goes to the
      worker stack's ResultsBucket and to cloud.aws.bucket in the gateway config.
    Value: !If [CreateBucket, !Ref ResultsBucket, !Ref ResultsBucketName]
